<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Enbooks | Under Maintenance</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-navy: #0b1320;
      --card-teal: #10252b;
      --border-teal: #1d434c;
      --accent-gold: #d4af37;
      --text-light: #f1f5f9;
      --text-muted: #cbd5e1;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background: radial-gradient(circle at top, #132c33 0%, var(--bg-navy) 70%);
      color: var(--text-light);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
      text-align: center;
    }

    .card {
      max-width: 580px;
      width: 100%;
      background-color: var(--card-teal);
      border: 1px solid var(--border-teal);
      border-top: 4px solid var(--accent-gold);
      border-radius: 14px;
      padding: 3rem 2.25rem;
      box-shadow: 0 24px 60px rgba(0, 0, 0, 0.5);
    }

    .status-badge {
      display: inline-block;
      padding: 0.35rem 0.95rem;
      border-radius: 999px;
      background: rgba(212, 175, 55, 0.12);
      border: 1px solid rgba(212, 175, 55, 0.4);
      color: var(--accent-gold);
      font-size: 0.8rem;
      font-weight: 600;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      margin-bottom: 1.5rem;
    }

    h1 {
      font-size: 2.15rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      margin-bottom: 1.25rem;
      color: var(--text-light);
    }

    p {
      color: var(--text-muted);
      font-size: 1.05rem;
      line-height: 1.7;
      margin-bottom: 1.75rem;
    }

    .divider {
      height: 1px;
      background: var(--border-teal);
      margin: 1.5rem auto;
      width: 60%;
    }

    .footer-note {
      font-size: 0.88rem;
      color: #94a3b8;
      margin-bottom: 0;
    }
  </style>
</head>
<body>

  <main class="card">
    <div class="status-badge">Under Maintenance</div>
    <h1>Hi, Welcome to Enbooks</h1>
    <p>
      Our page is currently under maintenance as we set up and organize our platform. 
      We will publish this shortly—thank you for visiting!
    </p>
    <div class="divider"></div>
    <p class="footer-note">Launching Shortly &nbsp;•&nbsp; enbooks.github.io</p>
  </main>

</body>
</html>
